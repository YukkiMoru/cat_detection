[project]
name = "cat-detection"
version = "0.1.0"
description = "Night cat detection using YOLO and RTX 3070"
readme = "README.md"
# PyTorchのCUDA版対応のため、3.12に固定
requires-python = ">=3.12,<3.13"
dependencies = [
    "ultralytics>=8.3.246",
    "torch",
    "torchvision",
    "torchaudio",
    "opencv-python>=4.12.0.88",
    "optuna>=4.5.0",
    "PyYAML",
    "requests",
    "pylint>=4.0.5",
    "tensorflow>=2.21.0",
    "mnn>=3.4.1",
    "pandas>=2.3.3",
    "seaborn>=0.13.2",
    "onnx-graphsurgeon==0.5.8",
    "onnx2tf==1.28.8",
    "onnxruntime==1.24.3",
    "onnxslim==0.1.87",
    "pnnx==20260112",
    "sng4onnx==2.0.1",
    "tf-keras==2.15.0",
    "openvino==2026.0.0",
    "nvidia-ml-py==13.595.45",
]

[dependency-groups]
dev = [
    "ruff>=0.14.11",
]

# --- ここからが重要：RTX 3070用のCUDA設定 ---

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

# ------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
]
ignore = [
    "E501", 
]

[tool.ruff.format]
quote-style = "double"
